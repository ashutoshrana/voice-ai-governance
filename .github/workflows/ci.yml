name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 is legacy compatibility; 3.14 exercises the maintained core runtime.
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Install Redis integration test server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src/voice_ai_governance --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  runtime-39:
    name: Python 3.9 installed-wheel runtime # legacy compatibility only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install hash-locked release build tools
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --version
          "$RUNNER_TEMP/release-tools/bin/python" -m pip list --format=freeze
      - run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation --wheel
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Check base runtime without development dependencies
        run: |
          python -m venv .runtime39
          .runtime39/bin/python -m pip install --no-deps dist/*.whl
          .runtime39/bin/python -I scripts/smoke_runtime.py

  package:
    needs: [test, runtime-39]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install hash-locked release build tools
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --version
          "$RUNNER_TEMP/release-tools/bin/python" -m pip list --format=freeze
      - name: Build and validate release artifacts
        run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation
          python scripts/verify_release.py
          if GITHUB_REF=refs/tags/v0.0.0 python scripts/verify_release.py; then
            echo "Mismatched release tag unexpectedly passed"
            exit 1
          fi
          "$RUNNER_TEMP/release-tools/bin/python" -m twine check --strict dist/*
      - name: Verify installed wheel in isolation
        run: |
          python -m venv .wheelcheck
          .wheelcheck/bin/python -m pip install --no-deps dist/*.whl
          .wheelcheck/bin/python -I -c 'import voice_ai_governance as p; from importlib.metadata import version; assert p.__version__ == version("voice-ai-governance"); assert callable(p.WarmTransferStateManager); assert callable(p.PIIScrubber)'
      - name: Verify installed sdist in isolation
        run: |
          python -m venv .sdistcheck
          .sdistcheck/bin/python -m pip install --require-hashes -r ci/release-build-requirements.txt
          .sdistcheck/bin/python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          .sdistcheck/bin/python -I -c 'import voice_ai_governance as p; from importlib.metadata import version; assert p.__version__ == version("voice-ai-governance"); assert callable(p.WarmTransferStateManager); assert callable(p.PIIScrubber)'
      - name: Check installed dependencies and record artifact hashes
        run: |
          .wheelcheck/bin/python -m pip check
          .sdistcheck/bin/python -m pip check
          sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: python-release-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
      - name: Verify uploaded artifact round trip without publishing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release-dist
          path: roundtrip-dist/
      - run: |
          (cd roundtrip-dist && sha256sum --check SHA256SUMS)
          python scripts/verify_release.py roundtrip-dist/dist/

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/voice-ai-governance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: .
          merge-multiple: true
      - name: Verify unchanged artifact bytes
        run: sha256sum --check SHA256SUMS
      - name: Publish distributions and attestations with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
