name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Install Redis integration test server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src/voice_ai_governance --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate release artifacts
        run: |
          python -m pip install build hatchling twine
          python -m build
          python scripts/verify_release.py
          if GITHUB_REF=refs/tags/v0.0.0 python scripts/verify_release.py; then
            echo "Mismatched release tag unexpectedly passed"
            exit 1
          fi
          python -m twine check --strict dist/*
      - name: Verify installed wheel in isolation
        run: |
          python -m venv .wheelcheck
          .wheelcheck/bin/python -m pip install --no-deps dist/*.whl
          .wheelcheck/bin/python -I -c 'import voice_ai_governance as p; from importlib.metadata import version; assert p.__version__ == version("voice-ai-governance"); assert callable(p.WarmTransferStateManager); assert callable(p.PIIScrubber)'
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: python-release-dist
          path: dist/
          if-no-files-found: error
      - name: Verify uploaded artifact round trip without publishing
        uses: actions/download-artifact@v8
        with:
          name: python-release-dist
          path: roundtrip-dist/
      - run: python scripts/verify_release.py roundtrip-dist/

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/voice-ai-governance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Publish distributions and attestations with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
