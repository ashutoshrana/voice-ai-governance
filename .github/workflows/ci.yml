name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Install Redis integration test server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src/voice_ai_governance --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate release artifacts
        run: |
          python -m pip install build hatchling twine
          python -m build
          python scripts/verify_release.py
          if GITHUB_REF=refs/tags/v0.0.0 python scripts/verify_release.py; then
            echo "Mismatched release tag unexpectedly passed"
            exit 1
          fi
          python -m twine check --strict dist/*
      - name: Verify installed wheel in isolation
        run: |
          python -m venv .wheelcheck
          .wheelcheck/bin/python -m pip install --no-deps dist/*.whl
          .wheelcheck/bin/python -I -c 'import voice_ai_governance as p; from importlib.metadata import version; assert p.__version__ == version("voice-ai-governance"); assert callable(p.WarmTransferStateManager); assert callable(p.PIIScrubber)'
      - uses: actions/upload-artifact@v7
        with:
          name: python-release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: python-release-dist
          path: dist/
      - name: Publish validated artifacts to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload dist/*
